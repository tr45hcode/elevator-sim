name: CI

on:
    push:
        branches: [main]
        tags: ["v*"]
    pull_request:

jobs:
    test:
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v5
            - uses: actions/setup-python@v6
              with:
                  python-version: "3.14"
            - run: pip install pytest
            - run: pytest -v

    release:
        needs: test
        if: startsWith(github.ref, 'refs/tags/v')
        runs-on: ubuntu-latest
        permissions:
            contents: write
        steps:
            - uses: actions/checkout@v5
            - run: |
                  zip "elevator-sim-$TAG.zip" elevator.py requests.py dataset.py README.md
                  gh release create "$TAG" "elevator-sim-$TAG.zip" --generate-notes
              env:
                  TAG: ${{ github.ref_name }}
                  GH_TOKEN: ${{ github.token }}
